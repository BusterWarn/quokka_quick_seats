<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="utf-8" http-equiv="encoding">
    <title>Quokka Quick Seats</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link href="https://fonts.googleapis.com/css?family=Quicksand" rel="stylesheet">
</head>
<body>
  <div id="qqs_alert" class="alert alert_danger hide .bg-warning">
      <span class="fa fa-info"></span>
      <span class="fa fa-check"></span>
      <span class="fas fa-exclamation-circle"></span>
      <span class="fas fa-exclamation-triangle"></span>
      <span class="msg">Warning: This is a warning alert!</span>
    <div class="close-btn" onClick="alert_close();" >
        <span class="fas fa-times"></span>
    </div>
  </div>

  <div id="seatTooltip" class="seat-tooltip" style="display: none;"></div>
  <div class="container">
      <div class="row justify-content-center my-5">
          <button class="button-63" id="getAllSeats" role="button">Get All Seats</button>
      </div>
      <div class="row justify-content-center my-3">
          <input type="text" id="fullName" placeholder="Full Name" class="form-control mx-2" style="max-width: 200px;">
          <input type="text" id="phoneNumber" placeholder="Phone Number" class="form-control mx-2" style="max-width: 200px;">
      </div>
      <div class="row justify-content-center" id="seatContainer">
          <!-- Buttons will be added here -->
      </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
